<!-- templates/core/bank_confirm_delete.html -->
{% extends "base/base.html" %}

{% block title %}Eliminar banco{% endblock title %}

{% block content %}
<h1>Eliminar banco</h1>
<p>¿Seguro que deseas eliminar el banco <strong>{{ bank.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'core:detail_bank' bank.id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock content %}
