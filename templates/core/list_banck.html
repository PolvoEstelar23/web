<!-- templates/core/list_banck.html -->

% extends 'base.html' %}
{% block title %}List of Banks{% endblock title%}

{% block content %}
<table class="table ">
    <head>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th></th>
        <th>Actions</th>

    </head>
    <tbody>
        {% for bank in banks %}
        <tr>
            <td>{{ bank.id }}</td>
            <td>{{ bank.name }}</td>
            <td>{{ bank.status }}</td>
            <td></td>
            <td>
                <a href="{% url 'core:detail_bank' bank.id %}" class="btn btn-outline-info">Detail</a>
                <a href="{% url 'core:edit_bank' bank.id %}" class="btn btn-outline-warning">UPDATE</a>
                <a href="{% url 'core:delete_bank' bank.id %}" class="btn btn-outline-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
